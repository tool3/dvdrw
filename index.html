<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no stops iOS Safari from auto-zooming
         the page whenever a text/range input gains focus. This is a code
         editor + form-heavy UI; users were ending up with a zoomed-in
         viewport after every interaction. Pinch-zoom is sacrificed
         deliberately so the editing surface stays stable. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>dvdrw — animated terminal SVGs</title>

    <!-- Network fonts. preconnect to the CDN origins so the actual font
         requests below don't pay the TLS handshake cost. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- General Sans (Fontshare): characterful premium grotesk for UI body. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <!-- JetBrains Mono (Google Fonts): distinctive monospace for code & runtime. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply persisted theme before paint to avoid flash
      try {
        const t = localStorage.getItem('dvdrw.theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
