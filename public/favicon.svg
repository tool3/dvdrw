<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- App-canvas gradient: deep midnight diagonal to violet, the same
         ambient mesh tones used by the page itself (cool indigo
         upper-left, warm violet lower-right). -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D17"/>
      <stop offset="45%" stop-color="#1A1532"/>
      <stop offset="100%" stop-color="#3A2566"/>
    </linearGradient>

    <!-- Disc body: iris-violet → deeper violet, matches the brand
         accent (#A698FF) at the highlight side. -->
    <radialGradient id="disc" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#C9BEFF"/>
      <stop offset="45%" stop-color="#A698FF"/>
      <stop offset="100%" stop-color="#3D2D8A"/>
    </radialGradient>

    <!-- Specular sheen — a soft white blob that catches the light off
         the disc's upper-left quadrant. Gives the CD a recognizable
         glossy quality without being noisy at 16px. -->
    <radialGradient id="sheen" cx="32%" cy="28%" r="38%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Hub gradient: smaller darker disc around the spindle hole so
         the centre has a distinct anatomy. -->
    <radialGradient id="hub" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1532"/>
      <stop offset="100%" stop-color="#06080F"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square app icon background. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Disc body. -->
  <circle cx="32" cy="32" r="22" fill="url(#disc)"/>

  <!-- A pair of faint concentric ring scribes — read as data tracks
       at icon sizes without becoming visual noise. -->
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.6"/>
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.6"/>

  <!-- Glossy sheen. -->
  <circle cx="32" cy="32" r="22" fill="url(#sheen)"/>

  <!-- Hub + spindle hole. -->
  <circle cx="32" cy="32" r="7.5" fill="url(#hub)"/>
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
  <circle cx="32" cy="32" r="2.4" fill="#06080F"/>
</svg>
