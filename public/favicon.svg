<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Disc body: iris-violet caught mid-light, anchored on the
         brand accent (#A698FF). Highlight biased to the upper-left so
         the disc reads as glossy without being symmetrical. -->
    <radialGradient id="disc" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#D7CEFF"/>
      <stop offset="45%" stop-color="#A698FF"/>
      <stop offset="100%" stop-color="#2A1E66"/>
    </radialGradient>

    <!-- Specular sheen — soft white blob on the upper-left quadrant
         that gives the disc its "this is plastic" gloss. -->
    <radialGradient id="sheen" cx="30%" cy="26%" r="38%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Hub: the inner darker disc around the spindle hole. Gradient
         keeps it from looking like a flat circle pasted on. -->
    <radialGradient id="hub" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1532"/>
      <stop offset="100%" stop-color="#06080F"/>
    </radialGradient>

    <!-- Engraved label ring — sits *just outside the spindle hole*, the
         innermost printable surface on a real CD. Path is a clockwise
         circle at radius 5, so the top of the ring reads upright and
         the bottom is inverted (matches real disc labels). -->
    <path
      id="labelRing"
      d="M 27 32 A 5 5 0 1 1 37 32 A 5 5 0 1 1 27 32"
      fill="none"
    />
  </defs>

  <!-- Disc body. Almost fills the viewBox now that the squircle
       background is gone. -->
  <circle cx="32" cy="32" r="30" fill="url(#disc)"/>

  <!-- Two faint track scribes — hint at data tracks at icon size
       without becoming visual noise. -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>

  <!-- Glossy sheen overlay. -->
  <circle cx="32" cy="32" r="30" fill="url(#sheen)"/>

  <!-- Hub. -->
  <circle cx="32" cy="32" r="9" fill="url(#hub)"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.3"/>

  <!-- Engraved ring text right above the spindle hole. Generic system
       sans because web fonts aren't reachable from the favicon
       document. Tiny font-size + tight tracking — readable at the
       larger Apple-touch sizes, ornamental at favicon sizes. -->
  <text
    font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif"
    font-size="1.4"
    font-weight="600"
    letter-spacing="0.18"
    fill="rgba(255,255,255,0.7)"
  >
    <textPath href="#labelRing" startOffset="0">DVDRW · TOOL3 · DVDRW · TOOL3 ·</textPath>
  </text>

  <!-- Spindle hole, rendered last so it cleanly masks any inside-edge
       overhang from the ring text. -->
  <circle cx="32" cy="32" r="2.8" fill="#06080F"/>
</svg>
